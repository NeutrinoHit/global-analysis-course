title:
  ru: Глобальный анализ данных в физике
  en: Global Data Analysis in Physics
summary:
  ru: Совместный анализ данных, точность измерений, вырождения параметров, систематики, значимость и согласие экспериментов. Примеры из физики нейтрино и частиц, астрофизики и космологии.
  en: Joint data analysis, measurement precision, parameter degeneracies, systematics, significance and consistency between experiments. Examples from neutrino and particle physics, astrophysics and cosmology.
status: planned
